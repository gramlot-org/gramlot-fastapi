name: Checks
on:
  push:
    branches: [main, develop, 'codex/**', 'wf/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      core-wheel-url:
        description: Optional pre-release core wheel HTTPS URL
        type: string
        required: false
      core-wheel-sha256:
        description: SHA-256 of the optional core wheel
        type: string
        required: false
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    env:
      CORE_WHEEL_URL: ${{ (inputs.core-wheel-url || inputs.core-wheel-sha256) && inputs.core-wheel-url || (!inputs.core-wheel-url && !inputs.core-wheel-sha256) && 'https://github.com/gramlot-org/gramlot-django/releases/download/v0.1.0-preview.1/gramlot-0.1.5-py3-none-any.whl' }}
      CORE_WHEEL_SHA256: ${{ (inputs.core-wheel-url || inputs.core-wheel-sha256) && inputs.core-wheel-sha256 || (!inputs.core-wheel-url && !inputs.core-wheel-sha256) && '63466802618c8cbd3fed0a83e1072556085a31bd522477dbcfe1122417a26f4a' }}
      CONSUMER_PYTHON: temp/consumer/${{ matrix.os == 'windows-latest' && 'Scripts/python.exe' || 'bin/python' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional exact core candidate
        run: python scripts/install_core_candidate.py
      - name: Install development dependencies from packages
        run: |
          python -m pip install '.[dev,docs]'
          python scripts/install_core_candidate.py --verify
      - name: Lint, behavior and documentation
        run: python scripts/check.py
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel into a clean consumer environment
        run: |
          python -m venv temp/consumer
          python scripts/install_core_candidate.py --python "$CONSUMER_PYTHON"
          "$CONSUMER_PYTHON" -m pip install dist/*.whl httpx
          python scripts/install_core_candidate.py --python "$CONSUMER_PYTHON" --verify
          python scripts/verify_installation.py --python "$CONSUMER_PYTHON"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && matrix.python == '3.12'
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
